<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23005629'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ETBH%3C/text%3E%3C/svg%3E">

</head>
<body>
<title>Forwarder Evaluation Reports</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E5%BE%B7%E7%BE%8E%E8%A1%8C%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8&display=swap">
<style>
/* Layout: three working columns — forwarder list | editor | live A4 preview. Paper pages keep a fixed print palette in both themes. */
:root{
  --bg:#f3f6f4; --panel:#ffffff; --panel-2:#f7faf8; --fg:#16241b; --muted:#5d6e63; --line:#dbe5de;
  --brand:#005629; --brand-ink:#ffffff; --brand-soft:#e3efe7; --accent:#b7791f; --danger:#b42318; --danger-soft:#fdecea;
  --ok:#1f7a45; --focus:#2f8f5b;
  --f-ui:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --f-doc:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#161e19; --panel-2:#1b241e; --fg:#e4ece6; --muted:#9aaca0; --line:#2a362e;
  --brand:#3fa26a; --brand-ink:#06140b; --brand-soft:#1f3326; --accent:#e0a54a; --danger:#f2867b; --danger-soft:#3a1d1a;
  --ok:#5cc489; --focus:#5cc489; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#161e19; --panel-2:#1b241e; --fg:#e4ece6; --muted:#9aaca0; --line:#2a362e;
  --brand:#3fa26a; --brand-ink:#06140b; --brand-soft:#1f3326; --accent:#e0a54a; --danger:#f2867b; --danger-soft:#3a1d1a;
  --ok:#5cc489; --focus:#5cc489; color-scheme:dark;}
*{box-sizing:border-box}
html{height:100%} body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:30px;background:#fff;border-radius:6px;padding:2px}
.brand b{font-size:15px;font-weight:700;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.top .grow{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="saved"] i{background:var(--ok)} .status[data-s="saving"] i{background:var(--accent)} .status[data-s="error"] i{background:var(--danger)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.shell{display:grid;grid-template-columns:260px minmax(380px,460px) minmax(0,1fr);gap:0;min-height:calc(100% - 58px)}
.col{min-width:0;border-right:1px solid var(--line)}
.side{background:var(--panel);padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.side h3{margin:4px 6px 0;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%}
.nav button:hover{background:var(--panel-2)}
.nav button[aria-current="true"]{background:var(--brand-soft);color:var(--fg)}
.nav.off button{opacity:.62}
.offgrp{display:flex;flex-direction:column;gap:6px}
.offgrp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;margin:4px 0 0;padding:6px;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.offgrp summary::-webkit-details-marker{display:none}
.offgrp summary::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
.offgrp[open] summary::before{transform:rotate(45deg)}
.offgrp summary:hover{background:var(--panel-2);color:var(--fg)}
.offgrp .nav{margin-top:2px}
.nav .code{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .code small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.chip.up{color:var(--ok)} .chip.down{color:var(--danger)}
.meanbox{margin:0 6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:12.5px;display:grid;gap:2px}
.meanbox b{font-size:20px;font-variant-numeric:tabular-nums}

.editor{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card > h4{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card > h4 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.card p.hint{margin:0;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select,.scores input,.hist input{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:90px;line-height:1.55}
.field input:focus,.field textarea:focus,.scores input:focus,.hist input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.scores{width:100%;border-collapse:collapse;font-size:12.5px}
.scores th{font-weight:500;color:var(--muted);text-align:right;padding:4px 4px;font-size:11.5px}
.scores th:first-child{text-align:left}
.scores td{padding:4px;vertical-align:middle}
.scores td:first-child{width:46%}
.scores input{text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums}
.scores input.bad{border-color:var(--danger);background:var(--danger-soft)}
.scores .mean{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.scores tfoot td{border-top:1px solid var(--line);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;padding-top:8px}
.scores tfoot td:first-child{text-align:left}
.tname{font-size:12.5px;line-height:1.35}
.tname small{color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.hist .field input{text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm{border:1px solid var(--danger);background:var(--danger-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.sec-item{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fhint{font-size:11.5px;color:var(--muted);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbox{border:1px solid var(--line);border-radius:999px;padding:4px 11px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;background:var(--panel-2);user-select:none}
.chipbox input{width:15px;height:15px;accent-color:var(--brand);margin:0}
.chipbox:has(input:checked){background:var(--brand-soft);border-color:var(--brand);font-weight:600}
.chipbox.extra{border-style:dashed}
.sumlist{display:flex;flex-direction:column;gap:8px}
.sumrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start}
.sumno{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:7px}
.sumrow textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px;width:100%;min-width:0;resize:none;overflow:hidden;line-height:1.5;min-height:38px}
.sumrow textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.sumact{display:flex;flex-direction:column;gap:2px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:6px;width:28px;height:26px;cursor:pointer;color:var(--muted);font-size:13px;line-height:1}
.icon-btn:hover{border-color:var(--line);color:var(--fg)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.steps{margin:0;padding-left:20px;display:grid;gap:3px;font-size:13px}
.plan{width:100%;border-collapse:collapse;font-size:12.5px}
.plan th{text-align:left;color:var(--muted);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.plan td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.planlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.planlist li{padding:8px 10px;border-top:1px solid var(--line);display:grid;gap:2px}
.planlist li:first-child{border-top:0}
.pl-main{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.pl-src{color:var(--muted);font-size:12.5px}
.pl-st{font-size:12px}
.pl-tot{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.pl-sub{font-size:12px;color:var(--muted)}
.plan select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--fg);max-width:130px}
.plan .st-new{color:var(--accent);font-weight:600} .plan .st-upd{color:var(--ok);font-weight:600} .plan .st-miss{color:var(--danger);font-weight:600}
.tablewrap{overflow-x:auto;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.optrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}
.optrow b{display:block;font-size:13px}
.optrow span{font-size:12px;color:var(--muted)}
.topic-row{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:end}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-size:15px}

.preview{background:var(--panel-2);display:flex;flex-direction:column;min-width:0}
.pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.pv-note{font-size:12px;color:var(--muted)}
.pv-warn{font-size:12px;color:var(--danger)}
.pv-scroll{padding:18px 16px 40px;overflow:auto}
.pv-stack{transform-origin:top left;display:flex;flex-direction:column;gap:18px;width:794px}
.pv-wrap{margin:0 auto}
.pg{box-shadow:0 1px 3px rgba(16,40,25,.12),0 8px 24px rgba(16,40,25,.10)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.busy div{background:var(--panel);color:var(--fg);padding:18px 22px;border-radius:12px;min-width:240px;text-align:center;display:grid;gap:8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);width:0}
#exportHost{position:fixed;left:0;top:0;z-index:-5;pointer-events:none}

.setnav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;gap:6px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding:6px 0 8px;margin:-6px 0 -4px}
.setnav button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.setnav button:hover{border-color:var(--brand);color:var(--brand)}
.editor .card,.editor [id^="set-"]{scroll-margin-top:118px} #editor{scroll-margin-top:70px} .editor .card:focus{outline:none}
.cat-grid{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card h4 em.warn{color:var(--danger);font-weight:600}
.card p.hint.err{color:var(--danger);font-weight:500}
.side-legend{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 6px 0;font-size:11px}
.side-legend .chip{font-size:10.5px}
label.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.trialbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--brand-soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--fg)}
.rwbar{background:color-mix(in srgb,var(--accent) 14%,var(--panel));}
.trialbar span{flex:1;min-width:240px}
.trialbar .btn{padding:4px 12px;font-size:12.5px}
.vchk{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:700;flex:0 0 auto;margin-right:4px;line-height:1}
.vchk.ok{background:var(--ok);color:#fff} .vchk.stale{background:var(--accent);color:#fff}
.side-vprog{margin:-6px 6px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.vcard{border-left:4px solid var(--line)}
.vcard.v-ok{border-left-color:var(--ok)} .vcard.v-stale{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))} .vcard.v-none{border-left-color:var(--muted)}
.vstate{margin:0;font-size:13px;line-height:1.5}
.vcard.v-ok .vstate b:first-child{color:var(--ok)} .vcard.v-stale .vstate b:first-child{color:var(--accent)}
.vrow .qa-input{flex:1 1 160px}
.vlog summary{cursor:pointer;font-size:12px;color:var(--muted)} .vlog ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loglist>li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.lg-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.lg-h b{color:var(--fg)} .lg-src{font-weight:600;color:var(--brand)} .lg-note{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px}
.loglist ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;display:grid;gap:2px}
.lg-k{color:var(--muted)} .lg-f{text-decoration:line-through;color:var(--muted)} .lg-t{font-weight:600}
.lg-more{color:var(--muted);list-style:none}
.logbox summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin-bottom:6px}
#logSel{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--fg)}
@media (min-width:1181px){
  /* keep the side list and the A4 preview in view while scrolling a long form */
  .side,.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto}
  .preview{overflow:hidden} .pv-scroll{flex:1;min-height:0} .pv-bar{position:static}
}
@media (max-width:1180px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .preview{grid-column:1 / -1;border-top:1px solid var(--line)}
  .pv-bar{position:static}
}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side,.editor{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:1fr}
  .brand span{display:none}
  .top{position:static}
  .setnav{top:env(safe-area-inset-top,0px)}
  .editor .card,.editor [id^="set-"]{scroll-margin-top:56px} #editor{scroll-margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Paper (fixed print palette) ---------- */
.pg{width:794px;height:1123px;background:#ffffff;color:#1b2a21;display:flex;flex-direction:column;padding:30px 50px 22px;font-family:var(--f-doc);font-size:13.5px;line-height:1.6;position:relative;overflow:hidden}
.pg *{box-sizing:border-box}
.pg-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:13px;padding-top:14px}
.pg-foot{border-top:1px solid #d5e3d9;padding-top:7px;display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#66786c;font-family:var(--f-ui)}
.lh{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lh img{width:60px;height:auto;display:block}
.lh .th{font-family:var(--f-ui);font-weight:700;font-size:21px;color:#005629;line-height:1.2}
.lh .cn{font-family:"Noto Serif TC","Noto Serif CJK TC",serif;font-weight:700;font-size:16px;color:#005629;letter-spacing:.42em;line-height:1.3}
.lh .en{font-family:var(--f-ui);font-weight:700;font-size:14px;color:#005629;letter-spacing:.05em;line-height:1.3}
.lh .tax{text-align:right;font-family:var(--f-ui);font-size:10.5px;color:#3e5045;line-height:1.4}
.lh .tax b{display:block;font-size:14px;color:#1b2a21;letter-spacing:.02em}
.lh-addr{font-size:9.5px;color:#4a5b50;line-height:1.5;margin-top:8px;font-family:var(--f-ui)}
.lh-addr b{color:#1b2a21;font-weight:600}
.lh-rule{margin-top:7px;border-top:2px solid #005629;border-bottom:1px solid #005629;height:4px}
.lh-scan{width:100%;display:block}
.lh-mini{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);border-bottom:2px solid #005629;padding-bottom:8px}

<script>
/* Web-app bridge: the program was written against claude.ai's window.claude (db / user / downloads).
   On GitHub Pages the same calls are answered by Firebase (Firestore + Google sign-in). */
(function(){
  let resolveReady; const ready = new Promise(r => resolveReady = r);
  window.__fbResolve = resolveReady;
  const ERR = { "permission-denied":"invalid_argument", "unauthenticated":"invalid_argument", "invalid-argument":"invalid_argument",
    "resource-exhausted":"resource_exhausted", "unavailable":"unavailable", "deadline-exceeded":"unavailable", "aborted":"unavailable", "internal":"unavailable" };
  const mapErr = e => ({ code: ERR[(e && e.code) || ""] || "unavailable", message: (e && e.message) || String(e) });
  const wrapSnap = s => { const ex = s.exists(); const d = ex ? s.data() : undefined; return { id: s.id, exists: ex, data: () => d, metadata: s.metadata }; };
  function dbApi(c){ const F = c.F, fs = c.fs;
    return {
      doc: path => ({ path, id: path.split("/").pop(),
        get: async () => { try{ return wrapSnap(await F.getDoc(F.doc(fs, path))); }catch(e){ throw mapErr(e); } },
        set: async d => { try{ await F.setDoc(F.doc(fs, path), d); }catch(e){ throw mapErr(e); } },
        update: async d => { try{ await F.updateDoc(F.doc(fs, path), d); }catch(e){ throw mapErr(e); } },
        delete: async () => { try{ await F.deleteDoc(F.doc(fs, path)); }catch(e){ throw mapErr(e); } },
        onSnapshot: (next, err) => F.onSnapshot(F.doc(fs, path), s => next(wrapSnap(s)), e => err && err(mapErr(e))) }),
      collection: col => ({
        onSnapshot: (next, err) => F.onSnapshot(F.collection(fs, col), qs => next({ docs: qs.docs.map(wrapSnap), size: qs.size, empty: qs.empty, metadata: qs.metadata,
          docChanges: () => qs.docChanges().map(ch => ({ type: ch.type, doc: wrapSnap(ch.doc), oldIndex: ch.oldIndex, newIndex: ch.newIndex })) }), e => err && err(mapErr(e))) })
    }; }
  const people = {};
  function userApi(c){ const u = c.user;
    return {
      can: async name => name === "data.write" ? c.role !== "viewer" : null,
      isOwner: async () => c.role === "owner", canEdit: async () => c.role === "owner",
      id: async () => u.uid, name: async () => u.displayName || u.email || "",
      me: async () => ({ id: u.uid, name: u.displayName || u.email || "", email: u.email }),
      profiles: async ids => { const out = {}; await Promise.all([].concat(ids).filter(Boolean).map(async id => {
          if(!(id in people)){ try{ const s = await c.F.getDoc(c.F.doc(c.fs, "people/" + id)); people[id] = s.exists() ? (s.data().name || s.data().email || "") : ""; }catch(_){ people[id] = ""; } }
          out[id] = { id, name: people[id], guest: false }; })); return out; }
    }; }
  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); } };
  window.claude = { use: async name => { const c = await ready; if(!c) return null;
    if(name === "db") return dbApi(c); if(name === "user") return userApi(c); if(name === "downloads") return downloads; return null; } };
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const gate = document.getElementById("fbGate"), msg = document.getElementById("fbMsg"), act = document.getElementById("fbAct");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (html, buttons) => { gate.hidden = false; msg.innerHTML = html; act.innerHTML = buttons || ""; };

/* firebase-config.js is read as plain text, so it works whether it holds our template or the whole snippet
   pasted straight from the Firebase console (imports, "const", comments and all) */
const DEFAULT_OWNERS = ["shipping@teckbeehang.com"];
const WEB_BUILD = "2026-11-04f";
let cfg = null, why = "";
try{
  const res = await fetch("./firebase-config.js?t=" + Date.now(), { cache: "no-store" });
  if(!res.ok) why = `หาไฟล์ <code>firebase-config.js</code> ไม่เจอ (${res.status}) — ตรวจว่าอัปโหลดไว้ชั้นนอกสุดของ repository ข้างไฟล์ index.html และชื่อไฟล์สะกดตรง`;
  else {
    const txt = await res.text();
    const pick = k => { const m = txt.match(new RegExp("[\"']?" + k + "[\"']?\\s*[:=]\\s*[\"']([^\"']+)[\"']")); return m ? m[1].trim() : undefined; };
    const fc = {}; ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"].forEach(k => { const v = pick(k); if(v) fc[k] = v; });
    const ownLine = (txt.match(/OWNER[^\n]*/) || [""])[0];
    const owners = ownLine.match(/[^\s"'\[\],;=]+@[^\s"'\[\],;]+/g);
    if(/PASTE_|YOUR_/i.test(txt) && (!fc.apiKey || /PASTE|YOUR_/i.test(fc.apiKey))) why = `ไฟล์ <code>firebase-config.js</code> ยังเป็นแบบฟอร์มเดิม — ยังไม่ได้วางค่าจาก Firebase หรือยังไม่ได้กด Commit changes<br>ถ้าเพิ่งกด Commit ให้รอ 1–2 นาทีแล้วกด Ctrl+F5`;
    else if(!fc.apiKey || !fc.projectId || !fc.appId) why = `อ่านไฟล์ <code>firebase-config.js</code> ได้ (${txt.length} ตัวอักษร) แต่ไม่พบ${["apiKey","projectId","appId"].filter(k=>!fc[k]).map(k=>" "+k).join(",")} — วางโค้ดจาก Firebase ให้ครบตั้งแต่บรรทัด apiKey ถึง appId`;
    else cfg = { firebaseConfig: fc, OWNER_EMAILS: owners && owners.length ? owners : DEFAULT_OWNERS };
  }
}catch(e){ why = "อ่านไฟล์ firebase-config.js ไม่ได้: " + esc(e && e.message || e); }
if(!cfg){
  say(`ยังไม่ได้ตั้งค่า Firebase<br><span class="gerr">${why}</span><br><small>เวอร์ชันโปรแกรม ${WEB_BUILD}</small>`);
  throw new Error("firebase-config.js is not usable");
}
const OWNERS = (cfg.OWNER_EMAILS || []).map(x => String(x).trim().toLowerCase()).filter(Boolean);
const app = initializeApp(cfg.firebaseConfig);
const fs = getFirestore(app), auth = getAuth(app);
const F = { doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection };
const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });

const loginBtn = `<button class="gbtn" type="button" id="fbLogin"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-2.8-.4-4.1H24v7.7h12c-.2 2-1.6 5-4.6 7l6.8 5.3C42.4 36.8 45 31.2 45 24.5z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-6.8-5.3c-1.9 1.3-4.4 2.2-7.8 2.2-6 0-11-4-12.8-9.4l-7 5.4C7.8 40.6 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.2 28.1c-.5-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1l-7-5.4C2.8 17.4 2 20.6 2 24s.8 6.6 2.2 9.5l7-5.4z"/><path fill="#EA4335" d="M24 10.5c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.3 30 2 24 2 15.3 2 7.8 7.4 4.2 14.5l7 5.4C13 14.5 18 10.5 24 10.5z"/></svg>เข้าสู่ระบบด้วย Google</button>`;
const emailForm = (note) => `<div class="gor">หรือเข้าสู่ระบบด้วยอีเมลบริษัท (ไม่ต้องมีบัญชี Google)</div>
  <form id="fbMailForm" class="gmail"><input id="fbMail" type="email" required placeholder="name@teckbeehang.com" autocomplete="email" aria-label="อีเมล"><button class="gbtn" type="submit">${note || "ส่งลิงก์เข้าสู่ระบบ"}</button></form>`;
const loginOptions = () => loginBtn + emailForm();
const cleanUrl = () => location.href.split("#")[0].split("?")[0];
document.addEventListener("submit", async e => {
  if(e.target.id !== "fbMailForm") return; e.preventDefault();
  const email = document.getElementById("fbMail").value.trim().toLowerCase(); if(!email) return;
  if(isSignInWithEmailLink(auth, location.href)){
    try{ await signInWithEmailLink(auth, email, location.href); localStorage.removeItem("fbEmailForSignIn"); history.replaceState(null, "", cleanUrl()); }
    catch(err){ say(`เข้าสู่ระบบไม่สำเร็จ <span class="gerr">(${esc(err && err.code || err)})</span> — ลิงก์อาจหมดอายุหรือใช้ไปแล้ว ขอลิงก์ใหม่`, loginOptions()); history.replaceState(null, "", cleanUrl()); }
    return;
  }
  try{ await sendSignInLinkToEmail(auth, email, { url: cleanUrl(), handleCodeInApp: true }); try{ localStorage.setItem("fbEmailForSignIn", email); }catch(_){}
    say(`ส่งลิงก์เข้าสู่ระบบไปที่ <b>${esc(email)}</b> แล้ว<br>เปิดอีเมลนั้นแล้วกดลิงก์ในเบราว์เซอร์เครื่องนี้ (ถ้าไม่เห็น ดูในโฟลเดอร์ Junk / Spam)`, `<button class="gbtn" type="button" id="fbBack">กลับ</button>`); }
  catch(err){ say(`ส่งลิงก์ไม่สำเร็จ <span class="gerr">(${esc(err && err.code || err)})</span> — ตรวจว่าเปิด “Email link (passwordless sign-in)” ใน Firebase แล้ว`, loginOptions()); }
});
document.addEventListener("click", async e => {
  if(e.target.closest("#fbBack")) say("เข้าสู่ระบบด้วยบัญชีที่ผู้ดูแลระบบเพิ่มไว้", loginOptions());
  if(e.target.closest("#fbLogin")){ try{ await signInWithPopup(auth, provider); }catch(err){
      if(err && /popup/.test(err.code || "")) return signInWithRedirect(auth, provider);
      say(`เข้าสู่ระบบไม่สำเร็จ <span class="gerr">(${esc(err && err.code || err)})</span>`, loginOptions()); } }
  if(e.target.closest("#fbLogout")) signOut(auth).then(() => location.reload());
});
getRedirectResult(auth).catch(() => {});

let started = false;
onAuthStateChanged(auth, async user => {
  if(started){ if(!user) location.reload(); return; }
  if(!user){
    if(isSignInWithEmailLink(auth, location.href)){
      let saved = ""; try{ saved = localStorage.getItem("fbEmailForSignIn") || ""; }catch(_){}
      if(saved){ try{ await signInWithEmailLink(auth, saved, location.href); localStorage.removeItem("fbEmailForSignIn"); history.replaceState(null, "", cleanUrl()); return; }catch(err){ say(`ลิงก์ใช้ไม่ได้ <span class="gerr">(${esc(err && err.code || err)})</span> — ลิงก์อาจหมดอายุหรือใช้ไปแล้ว ขอลิงก์ใหม่`, loginOptions()); history.replaceState(null, "", cleanUrl()); return; } }
      say("ยืนยันอีเมลที่ใช้ขอลิงก์เข้าสู่ระบบ (เปิดลิงก์คนละเครื่องกับที่ขอ)", emailForm("เข้าสู่ระบบ")); return;
    }
    say("เข้าสู่ระบบด้วยบัญชีที่ผู้ดูแลระบบเพิ่มไว้", loginOptions()); return; }
  say(`กำลังตรวจสิทธิ์ของ ${esc(user.email)}…`);
  const email = (user.email || "").toLowerCase();
  let role = OWNERS.includes(email) ? "owner" : null, members = null;
  try{ const s = await getDoc(doc(fs, "access/members")); members = s.exists() ? s.data() : null; }catch(_){ members = null; }
  if(!role && members){ const has = k => (members[k] || []).map(x => String(x).toLowerCase()).includes(email); role = has("editors") ? "editor" : has("viewers") ? "viewer" : null; }
  if(!role){ say(`บัญชี <b>${esc(user.email)}</b> ยังไม่ได้รับสิทธิ์ใช้งาน<br>ส่งอีเมลนี้ให้ผู้ดูแลระบบเพิ่มใน “จัดการผู้ใช้” แล้วโหลดหน้านี้ใหม่`, `<button class="gbtn" type="button" id="fbLogout">ออกจากระบบ / เปลี่ยนบัญชี</button>`); return; }
  started = true;
  try{ await setDoc(doc(fs, "people/" + user.uid), { name: user.displayName || "", email, at: Date.now() }); }catch(_){}
  gate.hidden = true;
  window.__fbResolve({ fs, F, user, role, members });
  accountMenu(user, role);
});

function accountMenu(user, role){
  const host = document.querySelector("header.top"); if(!host) return;
  const label = { owner:"ผู้ดูแลระบบ", editor:"ผู้แก้ไข", viewer:"ดูอย่างเดียว" }[role];
  const w = document.createElement("div"); w.className = "fb-acct";
  w.innerHTML = `<button type="button" id="fbAcctBtn" aria-haspopup="true" aria-expanded="false"><span class="av">${esc((user.displayName || user.email || "?").trim().charAt(0).toUpperCase())}</span><span class="nm">${esc(user.displayName || user.email)}</span></button>
    <div class="fb-menu" id="fbMenu" hidden><div><b>${esc(user.displayName || "")}</b><div class="role">${esc(user.email)} · ${label}</div></div>
    ${role === "owner" ? `<button class="btn" type="button" id="fbMembers">จัดการผู้ใช้</button>` : ""}
    <button class="btn ghost" type="button" id="fbLogout">ออกจากระบบ</button></div>`;
  host.appendChild(w);
  const btn = w.querySelector("#fbAcctBtn"), menu = w.querySelector("#fbMenu");
  btn.onclick = () => { menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); };
  document.addEventListener("click", e => { if(!w.contains(e.target)){ menu.hidden = true; btn.setAttribute("aria-expanded","false"); } });
  if(role === "owner") w.querySelector("#fbMembers").onclick = () => { menu.hidden = true; membersDialog(); };
}

async function membersDialog(){
  let m = { editors: [], viewers: [] };
  try{ const s = await getDoc(doc(fs, "access/members")); if(s.exists()) m = Object.assign(m, s.data()); }catch(_){}
  let d = document.getElementById("fbModal");
  if(!d){ d = document.createElement("div"); d.id = "fbModal"; d.className = "fb-modal"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-labelledby","fbMTitle"); document.body.appendChild(d); }
  d.innerHTML = `<div class="box"><h2 id="fbMTitle">จัดการผู้ใช้</h2>
    <p class="hint">ใส่อีเมลหนึ่งบรรทัดต่อหนึ่งคน (อีเมลบริษัทหรือ Gmail ก็ได้) · ผู้ดูแลระบบ: ${esc(OWNERS.join(", "))} (กำหนดในไฟล์ firebase-config.js และ firestore.rules)</p>
    <label>ผู้แก้ไข — กรอกและแก้ข้อมูลได้<textarea id="fbEd" spellcheck="false">${esc((m.editors || []).join("\n"))}</textarea></label>
    <label>ดูอย่างเดียว — เปิดดู Dashboard และเอกสารได้ แต่แก้ไม่ได้<textarea id="fbVw" spellcheck="false">${esc((m.viewers || []).join("\n"))}</textarea></label>
    <p class="hint" id="fbMMsg"></p>
    <div class="row"><button class="btn primary" type="button" id="fbMSave">บันทึก</button><button class="btn" type="button" id="fbMClose">ปิด</button></div></div>`;
  d.hidden = false;
  const list = id => [...new Set(document.getElementById(id).value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];
  d.querySelector("#fbMClose").onclick = () => { d.hidden = true; };
  d.querySelector("#fbMSave").onclick = async () => {
    const out = d.querySelector("#fbMMsg");
    try{ await setDoc(doc(fs, "access/members"), { editors: list("fbEd"), viewers: list("fbVw"), updatedAt: Date.now() }); out.textContent = "บันทึกแล้ว — คนที่เพิ่มใหม่ให้โหลดหน้าใหม่แล้วเข้าสู่ระบบ"; }
    catch(err){ out.textContent = "บันทึกไม่สำเร็จ: " + (err && err.code || err) + " — ตรวจว่าวางกฎ (firestore.rules) และใส่อีเมลผู้ดูแลถูกต้อง"; }
  };
  d.querySelector("#fbEd").focus();
}
</script>

  <div class="brand"><img id="brandLogo" alt="TBH"><b>Forwarder Evaluation Reports</b><span>Teck Bee Hang Co., Ltd.</span></div>
  <div class="seg" role="group" aria-label="มุมมอง"><button type="button" id="viewEdit" aria-pressed="true">กรอกข้อมูล & เอกสาร</button><button type="button" id="viewDash" aria-pressed="false">Dashboard</button></div>

</header>

    </div>
    <div class="pv-scroll" id="pvScroll"><div class="pv-wrap" id="pvWrap"><div class="pv-stack" id="pvStack"></div></div></div>
  </section>
</main>

  const o=[f.code,f.name,f.attn,orderByOptions(f.ports,S.settings.portOptions||[]),orderByOptions(f.branches,S.settings.branchOptions||[]),f.active!==false,f.include!==false,!!f.useHQ,f.evalHQ||"",!!f.useBranch,f.evalBranch||"",(f.prev||[]).map(q),(f.curr||[]).map(q),lines(f.summary),q(num(f.tonnage)),q(num(f.evalHC)),Object.keys(f.history||{}).sort().filter(y=>num(f.history[y])!==null).map(y=>[y,q(num(f.history[y]))])];
  const s=JSON.stringify(o); let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const vState = f => !f || !f.check ? "none" : f.check.sig===fwSig(f) ? "ok" : "stale";
const fmtWhen = ts => { try{ return new Date(ts).toLocaleString("th-TH-u-ca-gregory",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return new Date(ts).toISOString().slice(0,16).replace("T"," "); } };
const unverified = () => activeList().filter(f=>vState(f)!=="ok");
function vBadge(f){ const s=vState(f); return s==="ok" ? `<span class="vchk ok" title="ตรวจสอบแล้วโดย ${esc(f.check.by)}" aria-label="ตรวจสอบแล้ว">✓</span>` : s==="stale" ? `<span class="vchk stale" title="แก้ไขหลังตรวจสอบ — ควรตรวจอีกครั้ง" aria-label="แก้ไขหลังตรวจสอบ">!</span>` : ""; }
function vStateInner(f){ const s=vState(f), c=f.check;
  return s==="ok" ? `<b>✓ ตรวจสอบข้อมูลเรียบร้อยแล้ว</b> โดย <b>${esc(c.by)}</b> · ${esc(fmtWhen(c.at))}`
    : s==="stale" ? `<b>⚠ มีการแก้ไขข้อมูลหลังการตรวจสอบ</b> — ${esc(c.by)} ตรวจไว้เมื่อ ${esc(fmtWhen(c.at))} · ควรตรวจและลงชื่ออีกครั้ง`
    : `<b>ยังไม่ได้ตรวจสอบ</b> — ตรวจข้อมูลกับตัวอย่างเอกสารด้านขวา แล้วลงชื่อด้านล่าง`; }

    <div class="row vrow"><input id="v_name" class="qa-input" value="${esc(nm)}" placeholder="ชื่อผู้ตรวจสอบ" aria-label="ชื่อผู้ตรวจสอบ" autocomplete="name" ${ro}><button class="btn primary" type="button" data-act="vSign" ${ro}>${s==="none"?"ลงชื่อ ตรวจสอบแล้ว":"ลงชื่อตรวจสอบอีกครั้ง"}</button>${s!=="none"?`<button class="btn ghost" type="button" data-act="vClear" ${ro}>ยกเลิกการตรวจ</button>`:""}</div>

/* ---------------- charts (canvas, drawn at 3x for print) ---------------- */
function mkCanvas(w,h){ const c=document.createElement("canvas"), R=3; c.width=w*R; c.height=h*R; c.style.width=w+"px"; c.style.height=h+"px"; const g=c.getContext("2d"); g.scale(R,R); return [c,g]; }
const seg = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter("th",{granularity:"word"}) : null;
function wrapText(g, text, maxW){
  const parts = seg ? [...seg.segment(text)].map(x=>x.segment) : [...text];
  const out=[]; let cur="";
  for(const p of parts){ if(g.measureText(cur+p).width > maxW && cur){ out.push(cur.trim()); cur=p.trimStart(); } else cur+=p; }
  if(cur.trim()) out.push(cur.trim()); return out;
}
function rrect(g,x,y,w,h,r){ r=Math.min(r,h/2,w/2); g.beginPath(); g.moveTo(x,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r); g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r); g.lineTo(x,y+h); g.closePath(); }
function rrectFull(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function topicChart(f){
  const T=S.settings.topics, m=means(), hasPrev=f.prev.some(v=>v!==null);
  const W=666, labW=206, x0=218, x1=578, gh=hasPrev?54:40, top=6, H=top+T.length*gh+24;
  const [c,g]=mkCanvas(W,H); const max=Math.max(...T.map(t=>+t.weight||0),1);
  const xs=v=>x0+(x1-x0)*Math.max(0,Math.min(v,max))/max;
  const UI='"IBM Plex Sans Thai","Sarabun",sans-serif', DOC='"Sarabun","IBM Plex Sans Thai",sans-serif';
  const step = max<=10?2:max<=30?5:10;
  g.font="500 10px "+UI; g.textAlign="center"; g.textBaseline="top";
  for(let v=0; v<=max+1e-9; v+=step){ const x=xs(v); g.strokeStyle=C.grid; g.lineWidth=1; g.beginPath(); g.moveTo(x+.5,top); g.lineTo(x+.5,H-20); g.stroke(); g.fillStyle=C.muted; g.fillText(v+"%",x,H-16); }
  T.forEach((t,i)=>{
    const yg=top+i*gh; const mid=yg+(gh-8)/2;
    g.font="600 12px "+DOC; g.fillStyle=C.ink; g.textAlign="right"; g.textBaseline="middle";
    const ls=wrapText(g, shortTopic(t.name), labW-6).slice(0,2);
    const lh=15, sy=mid-(ls.length*lh)/2+lh/2-5;
    ls.forEach((l,j)=>g.fillText(l, labW, sy+j*lh));
    g.font="500 10px "+UI; g.fillStyle=C.muted; g.fillText("น้ำหนัก "+t.weight+"%", labW, sy+ls.length*lh-2);
    const bars = hasPrev ? [["prev",yg+6,14,C.prev],["curr",yg+23,18,C.brand]] : [["curr",yg+8,20,C.brand]];
    bars.forEach(([k,y,h,col])=>{ const v=f[k][i]; if(v===null) return; g.fillStyle=col; rrect(g,x0,y,Math.max(0,xs(v)-x0),h,3); g.fill();
      g.textAlign="right"; g.textBaseline="middle"; g.font=(k==="curr"?"700 12px ":"500 10.5px ")+UI; g.fillStyle=k==="curr"?C.brand:C.muted; g.fillText(f2(v), W-2, y+h/2); });
    const mv=m.curr[i]; if(mv!==null){ const x=xs(mv); const y1=yg+2, y2=yg+(hasPrev?45:32); g.strokeStyle=C.mean; g.lineWidth=2.5; g.beginPath(); g.moveTo(x,y1+4); g.lineTo(x,y2); g.stroke(); g.fillStyle=C.mean; g.beginPath(); g.moveTo(x,y1-1); g.lineTo(x+4.5,y1+4); g.lineTo(x,y1+9); g.lineTo(x-4.5,y1+4); g.closePath(); g.fill(); }
  });
  return c;
}
function yearChart(f){

    g.font=(isC?"700 ":"500 ")+"11px "+UI; g.fillStyle=isC?C.brand:C.ink; g.textAlign="center"; g.textBaseline="top"; g.fillText(isC? y+" (รอบนี้)": String(y), cx, bot+8);
    const mv=yearMean(y); pts.push(mv===null?null:[cx,ys(mv),mv]);
  });
  g.strokeStyle=C.mean; g.lineWidth=2.5; g.lineJoin="round"; let open=false; g.beginPath();
  pts.forEach(p=>{ if(!p){ open=false; return; } if(!open){ g.moveTo(p[0],p[1]); open=true; } else g.lineTo(p[0],p[1]); }); g.stroke();
  pts.forEach(p=>{ if(!p) return; g.fillStyle="#ffffff"; g.beginPath(); g.arc(p[0],p[1],4.5,0,Math.PI*2); g.fill(); g.fillStyle=C.mean; g.beginPath(); g.arc(p[0],p[1],3.2,0,Math.PI*2); g.fill();
    const t=fYear(p[2]); g.font="700 10.5px "+UI; const w=g.measureText(t).width+10; const ly=Math.max(p[1]-17, 9);
    g.fillStyle="rgba(255,255,255,.94)"; rrectFull(g,p[0]-w/2,ly-8,w,16,8); g.fill(); g.strokeStyle=C.mean; g.lineWidth=1; g.stroke(); g.fillStyle="#8a5608"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(t,p[0],ly+.5); });
  return c;
}

function kpiData(f){
  const s=S.settings, T=s.topics, m=means(); const tot=total(f.curr), ptot=total(f.prev);
  let low=null; T.forEach((t,i)=>{ const v=f.curr[i]; if(v===null||!(+t.weight)) return; const a=v/t.weight*100; if(!low||a<low.a) low={a,t}; });
  return { tot, ptot, m, gr: s.showGrade?gradeFor(tot):null, rk: s.showRank?rankOf(f):null,
    dPrev: (tot!==null&&ptot!==null)? tot-ptot : null, dMean: (tot!==null&&m.total!==null)? tot-m.total : null,
    lowTxt: !low ? "–" : low.a>=99.995 ? "ได้คะแนนเต็มทุกหัวข้อ" : shortTopic(low.t.name), lowSub: low&&low.a<99.995 ? "ได้ "+low.a.toFixed(1)+"% ของคะแนนเต็มหัวข้อ" : "" };

/* ---------------- pagination ---------------- */
function newPage(host, first, miniRight, footLeft, dense){
  const pg=el(`<div class="pg${dense?" dense-"+dense:""}"><div class="pg-head"></div><div class="pg-body"></div><div class="pg-foot"><span>${esc(footLeft)}</span><span class="pno"></span></div></div>`);
  pg.querySelector(".pg-head").appendChild(first? headerFull() : headerMini(miniRight));
  host.appendChild(pg); return pg;
}
function paginate(host, blocks, miniRight, footLeft, dense=0){
  host.innerHTML=""; const pages=[]; let pg=newPage(host,true,miniRight,footLeft,dense); pages.push(pg); let body=pg.querySelector(".pg-body"); let overflow=false;
  for(const b of blocks){
    if(b.breakBefore && body.children.length){ pg=newPage(host,false,miniRight,footLeft,dense); pages.push(pg); body=pg.querySelector(".pg-body"); }
    body.appendChild(b.el);
    if(body.scrollHeight > body.clientHeight + 1 && body.children.length>1){
      body.removeChild(b.el); pg=newPage(host,false,miniRight,footLeft,dense); pages.push(pg); body=pg.querySelector(".pg-body"); body.appendChild(b.el);
    }
    if(body.scrollHeight > body.clientHeight + 1) overflow=true;
  }
  pages.forEach((p,i)=>p.querySelector(".pno").textContent=`หน้า ${i+1} / ${pages.length}`);
  return {pages, overflow};
}
function footLeftFor(kind,f){ const r=S.settings.round; return kind==="eval" ? `${f.name||f.code} · ${r.docTitle} ${r.year}` : `${S.settings.rec.title}${f&&S.settings.rec.personalize?" · "+(f.name||f.code):""}`; }
function buildDoc(host, kind, f){
  const r=S.settings.round;
  if(kind==="eval") return paginate(host, evalBlocks(f), `${esc(r.docTitle)} ${esc(r.year)}<br>${esc(f.code)}`, footLeftFor(kind,f));
  // ข้อเสนอแนะ: ย่อระยะ/ตัวอักษรทีละขั้นจนพอดี 1 หน้า (สูงสุด 4 ขั้น)
  let res; for(let d=0; d<=4; d++){ res=paginate(host, recBlocks(f), `${esc(S.settings.rec.title)}<br>${esc(r.docTitle)} ${esc(r.year)}`, footLeftFor(kind,f), d); if(res.pages.length<=1 && !res.overflow) break; }
  return res;
}

async function fontsReady(){ try{ await Promise.all(["400 14px Sarabun","600 14px Sarabun","700 14px Sarabun","500 14px 'IBM Plex Sans Thai'","600 14px 'IBM Plex Sans Thai'","700 14px 'IBM Plex Sans Thai'","700 16px 'Noto Serif TC'"].map(f=>document.fonts.load(f, f.includes("Noto")?COMPANY.cn:"กขค ABC 123"))); await document.fonts.ready; }catch(e){} }
async function pdfFor(kind, f, pdf){
  const host=$("#exportHost"); const {pages}=buildDoc(host, kind, f);
  const { jsPDF } = window.jspdf; const doc = pdf || new jsPDF({unit:"pt", format:"a4", compress:true});
  for(let i=0;i<pages.length;i++){
    const cv = await html2canvas(pages[i], {scale:2.5, backgroundColor:"#ffffff", useCORS:true, logging:false, width:794, height:1123, windowWidth:1200, scrollX:0, scrollY:0});
    if(doc.__n) doc.addPage("a4","portrait"); doc.__n=(doc.__n||0)+1;
    doc.addImage(cv.toDataURL("image/jpeg",0.93), "JPEG", 0, 0, 595.28, 841.89, undefined, "FAST");
  }
  host.innerHTML="";
  return doc;
}
const slug = s => String(s||"").normalize("NFKD").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "Forwarder";
async function saveFile(name, blob){
  if(dl){ try{ await dl.save({filename:name, data:blob}); toast("บันทึกไฟล์ "+name+" แล้ว"); }catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"มีหน้าต่างบันทึกเปิดอยู่ ลองอีกครั้ง":"ดาวน์โหลดไม่ได้ในมุมมองนี้"); } return; }
  if(window.claude && window.claude.use){ toast("ดาวน์โหลดไม่ได้ในมุมมองนี้"); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); toast("ดาวน์โหลด "+name);
}
function busy(on, txt, p){ let b=$(".busy"); if(!on){ if(b) b.remove(); return; } if(!b){ b=el(`<div class="busy" role="alertdialog" aria-live="polite"><div><b></b><div class="bar"><i></i></div></div></div>`); document.body.appendChild(b);} b.querySelector("b").textContent=txt; b.querySelector("i").style.width=((p||0)*100)+"%"; }

function b64bytes(dataUrl){ const b=atob(dataUrl.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function docxBuild(kind, f){
  const D=window.docx; if(!D) throw new Error("ตัวสร้าง Word ยังโหลดไม่เสร็จ");
  const s=S.settings, r=s.round, T=s.topics; const FONT="Tahoma", G="005629", MUT="5B6D61", INK="1B2A21";
  const R=(text,o={})=>new D.TextRun({text:String(text??""),font:FONT,size:o.size||19,bold:!!o.bold,color:o.color||INK});
  const P=(kids,o={})=>new D.Paragraph({children:[].concat(kids),spacing:{before:o.before||0,after:o.after??60},alignment:o.align,pageBreakBefore:!!o.pb,keepNext:!!o.keepNext,keepLines:true,indent:o.indent,border:o.border,tabStops:o.tabs});
  const NB={style:D.BorderStyle.NONE,size:0,color:"FFFFFF"}; const NOB={top:NB,bottom:NB,left:NB,right:NB,insideHorizontal:NB,insideVertical:NB};
  const LB={style:D.BorderStyle.SINGLE,size:4,color:"D3E5D9"}; const LBS={top:LB,bottom:LB,left:LB,right:LB,insideHorizontal:LB,insideVertical:LB};
  const cell=(kids,o={})=>{ const c=new D.TableCell({children:[].concat(kids),shading:o.fill?{fill:o.fill,type:D.ShadingType.CLEAR,color:"auto"}:undefined,margins:{top:70,bottom:70,left:120,right:120},verticalAlign:D.VerticalAlign.CENTER,columnSpan:o.span}); c.__span=o.span||1; return c; };
  const TW=9906;
  const table=(rows,o={})=>{ const n=Math.max(...rows.map(cs=>cs.reduce((a,c)=>a+(c.__span||1),0))); const cw=o.cols||Array(n).fill(Math.floor(TW/n));
    return new D.Table({width:{size:TW,type:D.WidthType.DXA},columnWidths:cw,layout:D.TableLayoutType.FIXED,borders:o.borders||LBS,rows:rows.map(cs=>new D.TableRow({children:cs,cantSplit:true}))}); };
  const H2=(t,extra)=>P([R("■  ",{color:G,size:14}),R(t,{bold:true,color:G,size:23}),...(extra?[R("  "+extra,{color:MUT,size:17})]:[])],{before:200,after:90,keepNext:true});
  const RIGHT=[{type:D.TabStopType.RIGHT,position:D.TabStopPosition.MAX}];

  rows.forEach(r=>{ r.delta = r.prev===null?null:r.total-r.prev; r.vsMean = m.total===null?null:r.total-m.total; });
  const wp=rows.filter(r=>r.prev!==null);
  const roundAvg=avg(rows.map(r=>r.total)), prevAvg=wp.length?avg(wp.map(r=>r.prev)):null;
  const change=wp.length? r2(avg(wp.map(r=>r.total)))-r2(prevAvg) : null;

  const g=e.target.closest("[data-tip]"); const card=e.target.closest(".dv-card"); let tip=card&&card.querySelector(".dv-tip");
  document.querySelectorAll(".dv-tip").forEach(t=>{ if(t!==tip) t.hidden=true; });
  if(!g||!card){ if(tip) tip.hidden=true; return; }
  if(!tip){ tip=document.createElement("div"); tip.className="dv-tip"; card.appendChild(tip); }
  const [h,...ls]=g.dataset.tip.split("|"); tip.innerHTML=`<b>${esc(h)}</b>`+ls.map(l=>`<div>${esc(l)}</div>`).join(""); tip.hidden=false;
  const r=card.getBoundingClientRect(); let x=e.clientX-r.left+14, y=e.clientY-r.top+14; if(x+tip.offsetWidth>card.clientWidth) x=e.clientX-r.left-tip.offsetWidth-14; tip.style.left=Math.max(4,x)+"px"; tip.style.top=y+"px";
});
$("#dashView").addEventListener("mouseleave", ()=>document.querySelectorAll(".dv-tip").forEach(t=>t.hidden=true));
function setView(v){
  S.view=v; $("main.shell").hidden = v==="dash"; $("#dashView").hidden = v!=="dash";
  $("#viewEdit").setAttribute("aria-pressed", v!=="dash"); $("#viewDash").setAttribute("aria-pressed", v==="dash");
  if(v==="dash") renderDash(); else fitPreview();
}
$("#viewEdit").onclick=()=>setView("edit");
$("#viewDash").onclick=()=>setView("dash");
window.addEventListener("resize", ()=>{ if(S.view==="dash"){ clearTimeout(window._rzd); window._rzd=setTimeout(renderDash,150); } });

const PPT = { navy:"041E59", red:"D70815", red2:"FF4D4D", ink:"1A1A1A", mut:"5A6478", line:"C9D3E6", band:"DCE6F2", hdr2:"8DB4E2", panel:"F3F6FB",
  grade:["92D050","FFFF00","F4CCCC","DBEEF4","EDEDED"], title:"Poppins", body:"Poppins" };
const catEN = n => String(n||"").split(" · ")[0].trim();
function feedbackMatrix(D){
  const cats=(D.s.feedbackCats||[]).filter(c=>c && c.name);
  return cats.map(c=>{ const kws=splitList(c.kw); return {group:c.group||"", name:c.name, hits:D.act.map(f=>lines(f.summary).some(t=>NEG_WORDS.some(k=>t.includes(k)) && kws.some(k=>k && t.includes(k)))) }; });
}
function topGroups(D,k){ const g=[]; D.rows.forEach(r=>{ const v=r2(r.total); const last=g[g.length-1]; if(last && last.v===v) last.codes.push(r.code); else if(g.length<k) g.push({v,codes:[r.code]}); }); return g; }

/* Build the evaluation-section slides into a PptxGenJS deck. W/H = slide size in inches (the master deck's size when merging). */
function buildTbhDeck(D, W, H, opts){
  const P=new PptxGenJS(); P.defineLayout({name:"TBH", width:W, height:H}); P.layout="TBH";
  P.company="Teck Bee Hang Co., Ltd."; P.title=`Forwarder Evaluation ${D.s.round.year}`;
  const kx=W/20, ky=H/11.25, kf=Math.min(kx,ky);
  const sc=o=>{ const r=Object.assign({},o); ["x","w"].forEach(k=>{ if(r[k]!=null) r[k]*=kx; }); ["y","h"].forEach(k=>{ if(r[k]!=null) r[k]*=ky; });
    Object.keys(r).forEach(k=>{ if(/fontsize$/i.test(k) && typeof r[k]==="number") r[k]=Math.max(6,Math.round(r[k]*kf*2)/2); });
    if(r.rectRadius) r.rectRadius*=kf; if(r.line) r.line=Object.assign({},r.line,r.line.width?{width:r.line.width*kf}:{});
    if(r.colW) r.colW=r.colW.map(v=>v*kx); if(r.rowH!=null) r.rowH=Array.isArray(r.rowH)?r.rowH.map(v=>v*ky):r.rowH*ky; return r; };
  const BF=1.3; // body text reads small on a 20-inch slide
  const T=(sl,t,o)=>{ const q=Object.assign({fontFace:PPT.body,color:PPT.ink,margin:0,valign:"top",isTextBox:true},o); if(!o.fontFace&&q.fontSize) q.fontSize*=BF; return sl.addText(t,sc(q)); };
  const SH=(sl,type,o)=>sl.addShape(type,sc(o));
  const TB=(sl,rows,o)=>{ rows.forEach(r=>r.forEach(c=>{ if(c.options&&c.options.fontSize) c.options.fontSize=Math.max(6,Math.round(c.options.fontSize*BF*kf*2)/2); })); sl.addTable(rows,sc(o)); };
  const r_=D.s.round, yr=r_.year, slides=[];
  const page=(sl)=>{ sl.addImage(sc({data:TBH_HDR,x:14.01,y:0.07,w:5.95,h:1.64})); T(sl,"Page 00",{x:17.2,y:10.55,w:2.4,h:0.45,fontFace:PPT.title,fontSize:20,align:"right"}); };
  const title=(sl,t,sub)=>{ T(sl,t,{x:0.75,y:0.45,w:13.1,h:1.1,fontFace:PPT.title,fontSize:50,bold:true,color:PPT.navy,valign:"middle"}); if(sub) T(sl,sub,{x:0.8,y:1.55,w:15,h:0.5,fontFace:PPT.title,fontSize:20,bold:true,color:PPT.ink}); };
  const add=(fn)=>{ const sl=P.addSlide(); sl.background={color:"FFFFFF"}; fn(sl); page(sl); slides.push(sl); return sl; };
  const sec2=`02 Forwarder Evaluation`;

  if(opts && opts.cover) add(sl=>{
    T(sl,"Summary\nForwarder\nEvaluation",{x:1.0,y:2.6,w:11,h:4.4,fontFace:PPT.title,fontSize:72,bold:true,color:PPT.navy,valign:"middle"});
    T(sl,`Evaluation period: ${r_.currLabel||yr}`,{x:1.0,y:7.2,w:12,h:0.6,fontSize:20,color:PPT.ink});
    SH(sl,P.ShapeType.ellipse,{x:13.3,y:3.2,w:5.2,h:5.2,fill:{color:PPT.navy},line:{color:PPT.navy}});
    T(sl,`Y${yr}`,{x:13.3,y:4.9,w:5.2,h:1.6,fontFace:PPT.title,fontSize:64,bold:true,color:"FFFFFF",align:"center",valign:"middle"}); });

  // 1) Top performance
  add(sl=>{ title(sl,sec2);
    SH(sl,P.ShapeType.ellipse,{x:1.4,y:3.0,w:5.2,h:5.2,fill:{color:PPT.navy},line:{color:PPT.navy}});
    T(sl,"Top\nPerformance",{x:1.4,y:4.5,w:5.2,h:2.2,fontFace:PPT.title,fontSize:40,bold:true,color:"FFFFFF",align:"center",valign:"middle"});
    T(sl,`${r_.currLabel}`,{x:1.4,y:8.5,w:5.2,h:0.5,fontSize:16,color:PPT.mut,align:"center"});
    const g=topGroups(D,3), ys=[2.9,5.0,7.1], suf=["st","nd","rd"];
    g.forEach((grp,i)=>{ const y=ys[i];
      { const y1=5.6, y2=y+0.65; SH(sl,P.ShapeType.line,{x:6.6,y:Math.min(y1,y2),w:1.6,h:Math.max(0.01,Math.abs(y2-y1)),line:{color:PPT.navy,width:4},flipV:y2<y1}); }
      SH(sl,P.ShapeType.roundRect,{x:8.2,y,w:9.6,h:1.3,rectRadius:0.18,fill:{color:PPT.navy},line:{color:PPT.navy}});
      SH(sl,P.ShapeType.ellipse,{x:8.35,y:y+0.13,w:1.04,h:1.04,fill:{color:"FFFFFF"},line:{color:PPT.navy,width:2}});
      T(sl,[{text:String(i+1),options:{fontSize:34}},{text:suf[i],options:{fontSize:16,superscript:true}}],{x:8.35,y:y+0.13,w:1.04,h:1.04,fontFace:PPT.title,bold:false,color:"FF0000",align:"center",valign:"middle"});
      T(sl,grp.codes.join(" / "),{x:9.7,y,w:5.6,h:1.3,fontFace:PPT.title,fontSize:24,bold:true,color:"FFFFFF",valign:"middle"});
      T(sl,`${grp.v.toFixed(2)}%`,{x:15.3,y,w:2.3,h:1.3,fontFace:PPT.title,fontSize:24,bold:true,color:"FFFFFF",align:"right",valign:"middle"}); });
  });

  // 2) Overall performance table
  add(sl=>{ title(sl,sec2+" (by%)","Overall Performance");
    const rows=D.rows, n=rows.length, tonn=rows.some(r=>num(r.f.tonnage)!==null), gs=[...D.s.grades].sort((a,b)=>b.min-a.min);
    const gi=v=>{ const i=gs.findIndex(g=>v>=g.min); return i<0?gs.length-1:i; };
    const hc=(t,o)=>({text:t,options:Object.assign({bold:true,color:"FFFFFF",fill:{color:PPT.navy},align:"center",fontSize:15},o||{})});
    const mc=(t,o)=>({text:t,options:Object.assign({fill:{color:"FBE3D6"},align:"center",bold:true,fontSize:14},o||{})});
    const tb=[[hc("ITEM")].concat(rows.map(r=>hc(r.code)),[hc("MEAN",{color:PPT.ink,fill:{color:"FBE3D6"}})])];
    tb.push([{text:"Service Port",options:{bold:true,fill:{color:PPT.hdr2},align:"center",fontSize:13}}].concat(rows.map(r=>({text:(orderByOptions(r.f.ports,S.settings.portOptions||[])||"–").replace(/,\s*/g,",\n"),options:{fill:{color:PPT.hdr2},align:"center",fontSize:11}})),[mc(yr)]));
    const runs=(v)=>v===null?"–":[{text:fmtMT(v),options:{breakLine:true,bold:true}},{text:`≈ ${fmtCont(v)} × 20'`,options:{fontSize:Math.max(6,Math.round(12*kf*2)/2),color:PPT.mut}}];
    const tsum=rows.reduce((a,r)=>a+(num(r.f.tonnage)||0),0);
    if(tonn) tb.push([{text:[{text:r_.tonnageLabel||"Tonnage (MT)",options:{breakLine:true,bold:true}},{text:`1 × 20' ≈ ${teuMT()} MT`,options:{fontSize:Math.max(6,Math.round(11*kf*2)/2),color:PPT.mut}}],options:{fill:{color:PPT.band},fontSize:13}}].concat(rows.map(r=>({text:runs(num(r.f.tonnage)),options:{fill:{color:PPT.band},align:"center",fontSize:13}})),[mc(runs(tsum),{fontSize:13})]));
    if(rows.some(r=>num(r.f.evalHC)!==null)) tb.push([{text:"Total evaluation HC",options:{bold:true,fill:{color:PPT.band},fontSize:13}}].concat(rows.map(r=>({text:num(r.f.evalHC)===null?"–":String(num(r.f.evalHC)),options:{fill:{color:PPT.band},align:"center",fontSize:13,bold:true}})),[mc(String(rows.reduce((a,r)=>a+(num(r.f.evalHC)||0),0)),{fontSize:13})]));
    tb.push([{text:"Total Score (%)",options:{bold:true,fill:{color:"FFFF00"},fontSize:14}}].concat(rows.map(r=>({text:fmt2(r.total)+"%",options:{bold:true,align:"center",fill:{color:PPT.grade[Math.min(gi(r.total),PPT.grade.length-1)]},fontSize:14}})),[mc(fmt2(D.m.total)+"%")]));
    const pt=(v,w)=>v===null||v===undefined||!(+w)?"–":fmt2(v/(+w)*100)+"%";
    D.topics.forEach((t,i)=>tb.push([{text:t.en,options:{fontSize:13}}].concat(rows.map(r=>({text:pt(r.f.curr[i],t.w),options:{align:"center",fontSize:13}})),[mc(pt(t.mean,t.w),{fontSize:13})])));
    const fw=2.9, cw=(18.6-fw)/(n+1);
    TB(sl,tb,{x:0.7,y:2.4,w:18.6,colW:[fw].concat(Array(n+1).fill(cw)),fontFace:PPT.body,color:PPT.ink,border:{type:"solid",pt:1,color:"7F8FA9"},valign:"middle",rowH:0.55});

  M.file("ppt/presentation.xml", ser(pres)); M.file("ppt/_rels/presentation.xml.rels", ser(prels));
  // drop parts that are no longer reachable (media, notes and charts of the removed slides)
  { const reach=new Set(["[Content_Types].xml","_rels/.rels"]); const queue=[["_rels/.rels","_"]];
    while(queue.length){ const [rp,owner]=queue.shift(); const x=await readX(M,rp); if(!x) continue;
      for(const r of [...x.getElementsByTagNameNS(NS_PR,"Relationship")]){ if(r.getAttribute("TargetMode")==="External") continue; const t=resolve(owner,r.getAttribute("Target"));
        if(reach.has(t)) continue; reach.add(t); const tr=relsOf(t); if(M.file(tr)){ reach.add(tr); queue.push([tr,t]); } } }
    Object.keys(M.files).forEach(p=>{ if(M.files[p].dir || reach.has(p)) return; M.remove(p); removeOverride("/"+p); }); }
  M.file("[Content_Types].xml", ser(ct));
  // renumber "Page xx" on every slide in final order
  const finalIds=[...lst.getElementsByTagNameNS(NS_P,"sldId")]; const relById2=Object.fromEntries([...prels.getElementsByTagNameNS(NS_PR,"Relationship")].map(r=>[r.getAttribute("Id"),r]));
  for(const [i,sid] of finalIds.entries()){ const p=resolve("ppt/presentation.xml", relById2[sid.getAttributeNS(NS_R,"id")].getAttribute("Target")); const f=M.file(p); if(!f) continue; const x=await f.async("string"); const y=renumberPages(x,i+1); if(y!==x) M.file(p,y); }
  return { blob: await M.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation"}), inserted: added.length, removed: removeSet.size, total: finalIds.length, firstNew: finalIds.indexOf(added[0])+1 };
}
async function masterSize(buf){ const z=await JSZip.loadAsync(buf); const x=await z.file("ppt/presentation.xml").async("string"); const m=x.match(/<p:sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); return m? {w:+m[1]/914400, h:+m[2]/914400} : {w:20,h:11.25}; }
async function exportPptx(){
  if(!window.PptxGenJS){ toast("ตัวสร้าง PowerPoint ยังโหลดไม่เสร็จ ลองอีกครั้ง"); return; }
  const D=dashData(); if(!D.n){ toast("ยังไม่มีคะแนนรอบนี้"); return; }
  busy(true,"กำลังสร้าง PowerPoint…",.4);
  try{ const P=buildTbhDeck(D,20,11.25,{cover:true,followUp:true}); const z=await JSZip.loadAsync(await P.write({outputType:"arraybuffer"}));
    let i=0; for(const p of Object.keys(z.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0])){ i++; z.file(p, renumberPages(await z.file(p).async("string"), i)); }
    const blob=await z.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    busy(false); await saveFile(`TBH_Forwarder_Evaluation_Slides_${year()}.pptx`, blob);
  }catch(e){ busy(false); console.error(e); toast("สร้าง PowerPoint ไม่สำเร็จ: "+(e.message||e)); }
}
async function mergeWithMaster(file){
  if(!window.PptxGenJS||!window.JSZip){ toast("ตัวสร้าง PowerPoint ยังโหลดไม่เสร็จ ลองอีกครั้ง"); return; }
  const D=dashData(); if(!D.n){ toast("ยังไม่มีคะแนนรอบนี้"); return; }
  const cfg=S.settings.pptMerge||{};
  busy(true,"กำลังอ่านไฟล์ PowerPoint หลัก…",.15);
  try{ const buf=await file.arrayBuffer(); const sz=await masterSize(buf);
    busy(true,"กำลังสร้างสไลด์ผลประเมิน…",.4); const P=buildTbhDeck(D,sz.w,sz.h,{}); const gen=await P.write({outputType:"arraybuffer"});
    busy(true,"กำลังรวมไฟล์…",.7); const res=await mergeIntoMaster(buf,gen,cfg);
    busy(false); const base=file.name.replace(/\.pptx$/i,"").replace(/[^\w\-. ]+/g,"").trim()||"Presentation";
    toast(`รวมแล้ว: ลบ ${res.removed} สไลด์ · ใส่ใหม่ ${res.inserted} สไลด์ (หน้า ${res.firstNew}–${res.firstNew+res.inserted-1}) · ทั้งหมด ${res.total} หน้า`);
    await saveFile(`${base}_${year()}_Combined.pptx`, res.blob);
  }catch(e){ busy(false); console.error(e); toast("รวมไฟล์ไม่สำเร็จ: "+(e.message||e)); }
}
